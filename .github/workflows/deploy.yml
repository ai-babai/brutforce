name: Deploy
on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful main CI run ID (identifies immutable release)
        required: true
      target:
        type: choice
        options: [test, prod]
        default: test
        description: PROD requires separate recorded human approval on Sigma
      candidate_id:
        description: Registered 64-char app+data+model candidate; required for real catalog and PROD
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: brutforce-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CI_RUN: ${{ inputs.ci_run }}
      TARGET: ${{ inputs.target }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
    steps:
      - name: Resolve successful main release
        id: resolve
        run: |
          [[ "$CI_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$REPO/actions/runs/$CI_RUN" > "$RUNNER_TEMP/run.json"
          jq -e '.conclusion == "success" and .head_branch == "main" and .event == "push" and .path == ".github/workflows/ci.yml"' "$RUNNER_TEMP/run.json"
          sha=$(jq -r .head_sha "$RUNNER_TEMP/run.json")
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh run download "$CI_RUN" --repo "$REPO" --name "release-$sha" --dir "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          sha256sum -c "release-$sha.tar.gz.sha256"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure constrained SSH identity
        env:
          SSH_KEY: ${{ secrets.SIGMA_RELEASE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SIGMA_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Install and deploy TEST, or promote approved PROD
        run: |
          candidate=${CANDIDATE_ID:-$RELEASE_SHA}
          [[ "$candidate" =~ ^[a-f0-9]{40}$|^[a-f0-9]{64}$ ]]
          if [ "$TARGET" = test ]; then
            checksum=$(cut -d ' ' -f1 "$RUNNER_TEMP/package/release-$RELEASE_SHA.tar.gz.sha256")
            # An immutable package may already exist after a failed smoke/retry.
            ssh -o BatchMode=yes lct-release@217.26.30.220 status > "$RUNNER_TEMP/status.json"
            if ! jq -e --arg sha "$RELEASE_SHA" '.releases[] | select(.revision == $sha)' "$RUNNER_TEMP/status.json" >/dev/null; then
              ssh -o BatchMode=yes lct-release@217.26.30.220 "install $RELEASE_SHA $checksum $CI_RUN" < "$RUNNER_TEMP/package/release-$RELEASE_SHA.tar.gz"
            else
              jq -e --arg sha "$RELEASE_SHA" --arg checksum "$checksum" '.releases[] | select(.revision == $sha) | .archiveSHA256 == $checksum' "$RUNNER_TEMP/status.json"
            fi
            ssh -o BatchMode=yes lct-release@217.26.30.220 "deploy-test $candidate"
            ssh -o BatchMode=yes lct-release@217.26.30.220 status > "$RUNNER_TEMP/deployed-status.json"
            catalog_version=$(jq -er --arg candidate "$candidate" '.releases[] | select((.candidateId // .revision) == $candidate) | .catalogVersion' "$RUNNER_TEMP/deployed-status.json")
            echo "EXPECTED_CATALOG_VERSION=$catalog_version" >> "$GITHUB_ENV"
          elif [ "$TARGET" = prod ]; then
            [[ "$candidate" =~ ^[a-f0-9]{64}$ ]] || { echo 'PROD requires exact candidate_id' >&2; exit 2; }
            ssh -o BatchMode=yes lct-release@217.26.30.220 "promote $candidate"
          else
            exit 2
          fi
      - name: Verify public TEST without optional Chromium checks
        if: inputs.target == 'test'
        env:
          BASE_URL: https://test.ops.dzap.pw
          EXPECTED_REVISION: ${{ env.RELEASE_SHA }}
          EXPECTED_CATALOG_VERSION: ${{ env.EXPECTED_CATALOG_VERSION }}
        run: |
          curl --fail --silent --show-error "$BASE_URL/release.json" | jq -e --arg sha "$EXPECTED_REVISION" '.revision == $sha and .mode == "real"'
          curl --fail --silent --show-error "$BASE_URL/v1/health" | jq -e '.ok == true and .demo == false'
          curl --fail --silent --show-error "$BASE_URL/v2/catalog?limit=1" | jq -e --arg version "$EXPECTED_CATALOG_VERSION" '.catalogVersion == $version and (.candidates | length) == 1'
      - name: Verify public PROD endpoint
        if: inputs.target == 'prod'
        run: |
          curl --fail --silent --show-error https://app.dzap.pw/v1/health | jq -e '.ok == true'
          curl --fail --silent --show-error https://app.dzap.pw/release.json | jq -e --arg sha "$RELEASE_SHA" '.revision == $sha'
      - name: Summary
        if: always()
        run: |
          printf '## Release %s\n\nCandidate: %s\n\nEnvironment: %s\n\n[Ops releases](https://ops.dzap.pw/releases/)\n\nML quality is not measured by catalog gates.\n' "$RELEASE_SHA" "${CANDIDATE_ID:-$RELEASE_SHA}" "$TARGET" >> "$GITHUB_STEP_SUMMARY"
