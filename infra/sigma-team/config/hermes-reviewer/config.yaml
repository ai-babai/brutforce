model:
  provider: clirelay
  default: gpt-5.6-terra
  base_url: https://clirelay.mipopkov.com/v1
  context_length: 272000
agent:
  reasoning_effort: medium
  max_turns: 8
  run_budget_seconds: 120
terminal:
  backend: local
  timeout: 120
  home_mode: real
security:
  allow_lazy_installs: false
platform_toolsets:
  cli: [terminal, file]
providers:
  clirelay:
    base_url: https://clirelay.mipopkov.com/v1
    api_key_env: OPENAI_API_KEY
    api_mode: chat_completions
memory:
  memory_enabled: false
  user_profile_enabled: false
skills:
  creation_nudge_interval: 0
curator:
  enabled: false
session_reset:
  mode: none
